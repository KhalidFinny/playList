<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#fff8f6" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />

    <title>PLAY // Interactive Sound Archive</title>
    <meta
      name="description"
      content="PLAY Sound Archive — A premium, real-time interactive music broadcasting platform for organizations and enterprise environments."
    />

    <!-- Open Graph / Social -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="PLAY // Interactive Sound Archive" />
    <meta
      property="og:description"
      content="A premium, real-time interactive music broadcasting platform for organizations and enterprise environments."
    />
    <meta property="og:image" content="/og-image.svg" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PLAY // Interactive Sound Archive" />
    <meta
      name="twitter:description"
      content="A premium, real-time interactive music broadcasting platform for organizations and enterprise environments."
    />

    <!-- Self-healing script to clear stale service workers from previous projects -->
    <script>
      if ("serviceWorker" in navigator) {
        navigator.serviceWorker.getRegistrations().then((regs) => {
          for (let reg of regs) {
            reg.unregister().then(() => console.log("Stale Service Worker cleared."));
          }
        });
      }
    </script>

    <!--
      Applies the stored (or system) theme before first paint so a dark-mode user
      never sees a light flash. Keep this in sync with `shared/lib/theme.ts`.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark = stored
            ? stored === "dark"
            : window.matchMedia("(prefers-color-scheme: dark)").matches;
          if (dark) {
            document.documentElement.classList.add("dark");
            document.documentElement.style.colorScheme = "dark";
          }
        } catch (e) {
          /* private mode: fall through to light */
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
